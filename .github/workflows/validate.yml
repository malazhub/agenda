name: Validate Agenda

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript and source validation
        run: npm run lint
      - name: Cloudflare Worker tests
        run: npm run test:worker
      - name: Production build
        env:
          VITE_CLOUDFLARE_API_URL: https://agenda-api.mycamp.workers.dev
        run: npm run build -- --base=/agenda/
