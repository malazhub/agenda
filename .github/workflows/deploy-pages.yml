name: Deploy Agenda and Cloudflare API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply D1 database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 15cd99734560c6868dd06d79236a0334
          command: d1 migrations apply agenda-db --remote --config cloudflare/wrangler.toml

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 15cd99734560c6868dd06d79236a0334
          command: deploy --config cloudflare/wrangler.toml

      - name: Verify live Cloudflare Workers AI response
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://agenda-api.malazhub-agenda.workers.dev/api/ai/generate";
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ text: "Reply with exactly: AGENDA_AI_OK" }],
              maxOutputTokens: 96
            }),
            signal: AbortSignal.timeout(55000)
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) {
            console.error(`Workers AI smoke test failed: HTTP ${response.status} — ${body.error || "No error details returned"}`);
            process.exit(1);
          }
          if (typeof body.text !== "string" || !body.text.trim()) {
            console.error("Workers AI smoke test failed: the Worker returned no answer text.");
            process.exit(1);
          }
          console.log("Cloudflare Workers AI live-response test passed:", body.text.trim().slice(0, 160));
          NODE

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare source folders
        run: node scripts/prepare-pages.mjs

      - name: Install dependencies
        run: npm install

      - name: Build site
        env:
          VITE_CLOUDFLARE_API_URL: ${{ vars.CLOUDFLARE_API_URL }}
        run: npm run build -- --base=/agenda/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, deploy-worker]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
