name: Deploy Agenda and Cloudflare API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agenda-pages-deploy
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply D1 database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 15cd99734560c6868dd06d79236a0334
          command: d1 migrations apply agenda-db --remote --config cloudflare/wrangler.toml

      - name: Verify Director phone-password database schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 15cd99734560c6868dd06d79236a0334
          command: d1 execute agenda-db --remote --command "SELECT password_must_change, phone_password_disabled_at, registered_educator_id, student_grade_label FROM accounts LIMIT 0" --config cloudflare/wrangler.toml

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 15cd99734560c6868dd06d79236a0334
          command: deploy --config cloudflare/wrangler.toml

      - name: Verify GitHub Pages browser CORS access to Owner API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = "https://malazhub.github.io";
          const endpoint = "https://agenda-api.malazhub-agenda.workers.dev/api/owner/directors";

          for (const method of ["GET", "POST"]) {
            const requestedHeaders = method === "POST"
              ? "authorization,content-type"
              : "authorization";
            const response = await fetch(endpoint, {
              method: "OPTIONS",
              headers: {
                Origin: origin,
                "Access-Control-Request-Method": method,
                "Access-Control-Request-Headers": requestedHeaders
              }
            });
            const allowedOrigin = response.headers.get("access-control-allow-origin");
            const allowedHeaders = (response.headers.get("access-control-allow-headers") || "")
              .toLowerCase().split(",").map(value => value.trim());
            if (response.status !== 204 || allowedOrigin !== origin ||
                !allowedHeaders.includes("authorization") ||
                (method === "POST" && !allowedHeaders.includes("content-type"))) {
              console.error("Owner API CORS preflight failed:", {
                method,
                status: response.status,
                allowedOrigin,
                allowedHeaders
              });
              process.exit(1);
            }
            console.log(`Owner API ${method} preflight passed for ${origin}`);
          }

          const readResponse = await fetch(endpoint, {
            headers: { Origin: origin, Authorization: "Bearer invalid-smoke-test-token" }
          });
          if (readResponse.headers.get("access-control-allow-origin") !== origin ||
              readResponse.status !== 401) {
            console.error("Owner API GET request failed its browser-origin/authentication check:", {
              status: readResponse.status,
              allowedOrigin: readResponse.headers.get("access-control-allow-origin")
            });
            process.exit(1);
          }
          console.log("Owner API actual GET request passed (401 for invalid test token, visible to browser origin).");

          const createResponse = await fetch(endpoint, {
            method: "POST",
            headers: {
              Origin: origin,
              Authorization: "Bearer invalid-smoke-test-token",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              fullName: "Diagnostics only",
              email: "diagnostics@example.invalid",
              phone: "0000000000",
              schoolName: "Diagnostics only",
              paymentReceived: true
            })
          });
          if (createResponse.headers.get("access-control-allow-origin") !== origin ||
              createResponse.status !== 401) {
            console.error("Owner API actual POST request failed its browser-origin/authentication check:", {
              status: createResponse.status,
              allowedOrigin: createResponse.headers.get("access-control-allow-origin")
            });
            process.exit(1);
          }
          console.log("Owner API actual POST request passed (401 before any create action, visible to browser origin).");
          NODE

      - name: Verify live Cloudflare Workers AI response (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://agenda-api.malazhub-agenda.workers.dev/api/ai/generate";
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ text: "Reply with exactly: AGENDA_AI_OK" }],
              maxOutputTokens: 96
            }),
            signal: AbortSignal.timeout(55000)
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) {
            console.error(`Workers AI smoke test failed: HTTP ${response.status} — ${body.error || "No error details returned"}`);
            process.exit(1);
          }
          if (typeof body.text !== "string" || !body.text.trim()) {
            console.error("Workers AI smoke test failed: the Worker returned no answer text.");
            process.exit(1);
          }
          console.log("Cloudflare Workers AI live-response test passed:", body.text.trim().slice(0, 160));

          const arabicResponse = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [
                { role: "system", parts: [{ text: "أجب باللغة العربية فقط وبأسلوب طبيعي." }] },
                { role: "user", parts: [{ text: "عرّف منصة Agenda باختصار." }] }
              ],
              maxOutputTokens: 512
            }),
            signal: AbortSignal.timeout(55000)
          });
          const arabicBody = await arabicResponse.json().catch(() => ({}));
          if (!arabicResponse.ok || typeof arabicBody.text !== "string" || !/[\\u0600-\\u06FF]/u.test(arabicBody.text)) {
            console.error(`Workers AI Arabic-language test failed: HTTP ${arabicResponse.status} — ${arabicBody.error || arabicBody.text || "No Arabic response returned"}`);
            process.exit(1);
          }
          console.log("Cloudflare Workers AI Arabic-language test passed:", arabicBody.text.trim().slice(0, 160));
          NODE

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare source folders
        run: node scripts/prepare-pages.mjs

      - name: Install dependencies
        run: npm install

      - name: Build site
        env:
          VITE_CLOUDFLARE_API_URL: ${{ vars.CLOUDFLARE_API_URL }}
        run: npm run build -- --base=/agenda/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, deploy-worker]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
